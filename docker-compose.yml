version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: erp_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: erp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mapeia todos os arquivos .sql do diretório local para a pasta de inicialização do Postgres:
      - ./:/docker-entrypoint-initdb.d/

volumes:
  postgres_data: